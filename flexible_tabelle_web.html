<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flexible Tabelle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#17181a}
header{padding:18px 16px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
h1{margin:0 0 12px;font-size:22px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:1px solid #ccc;background:#fff;border-radius:10px;padding:9px 13px;white-space:nowrap}.tabs button.active{background:#17181a;color:white}
main{padding:16px;max-width:1100px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.add{border:0;border-radius:10px;padding:10px 14px;background:#17181a;color:white}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 130px 130px 110px auto;gap:10px;align-items:center}
.small{font-size:13px;color:#666}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eee;font-size:12px}.high{font-weight:700}.empty{text-align:center;padding:35px;color:#777}
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,520px);box-shadow:0 15px 50px #0003}dialog::backdrop{background:#0005}.form{padding:18px}.form label{display:block;margin:10px 0 5px;font-size:13px;font-weight:600}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.cancel{padding:9px 13px;border:1px solid #ccc;background:white;border-radius:9px}
@media(max-width:700px){.row{grid-template-columns:1fr}.row .hide-mobile{display:none}}
</style>
</head>
<body>
<header>
<h1>Flexible Tabelle</h1>
<div class="tabs">
<button class="active" data-view="all">Gesamt</button>
<button data-view="open">Offene Punkte</button>
<button data-view="dated">Mit Datum</button>
</div>
</header>
<main>
<div class="bar"><button class="add" id="add">+ Neuer Eintrag</button></div>
<div id="list"></div>
</main>

<dialog id="dlg">
<form class="form" method="dialog" id="form">
<h2 style="margin-top:0">Neuer Eintrag</h2>
<label>Titel</label><input id="title" required>
<label>Priorität</label><select id="priority"><option>mittel</option><option>hoch</option><option>niedrig</option></select>
<label>Fällig am</label><input id="date" type="date">
<label>Ort</label><input id="place">
<label>Notiz</label><textarea id="note" rows="3"></textarea>
<label>Status</label><select id="status"><option>offen</option><option>in Bearbeitung</option><option>Abgeschlossen</option></select>
<div class="actions"><button type="button" class="cancel" id="cancel">Abbrechen</button><button class="add">Speichern</button></div>
</form>
</dialog>
<script>
let items=JSON.parse(localStorage.getItem("flexibleTabelle")||"[]");
let view="all";
const list=document.getElementById("list"),dlg=document.getElementById("dlg");
function save(){localStorage.setItem("flexibleTabelle",JSON.stringify(items))}
function render(){
 let a=[...items];
 if(view==="open")a=a.filter(x=>x.status!=="Abgeschlossen").sort((x,y)=>({hoch:0,mittel:1,niedrig:2}[x.priority]-({hoch:0,mittel:1,niedrig:2}[y.priority]))||(x.date||"9999").localeCompare(y.date||"9999"));
 if(view==="dated")a=a.filter(x=>x.date).sort((x,y)=>x.date.localeCompare(y.date));
 if(!a.length){list.innerHTML='<div class="card empty">Noch keine Einträge in dieser Ansicht.</div>';return}
 list.innerHTML=a.map(x=>`<div class="card"><div class="row">
 <div><strong>${esc(x.title)}</strong><div class="small">${esc(x.note||"")}</div></div>
 <div>${view!=="dated"?'<span class="badge '+(x.priority==="hoch"?'high':'')+'">'+esc(x.priority)+'</span>':esc(x.date||"")}</div>
 <div>${view==="dated"?esc(x.place||""):esc(x.date||"")}</div>
 <div><span class="badge">${esc(x.status)}</span></div>
 <button class="cancel" onclick="del('${x.id}')">Löschen</button>
 </div></div>`).join("")
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function del(id){items=items.filter(x=>x.id!==id);save();render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()});
document.getElementById("add").onclick=()=>{
 const form=document.getElementById("form");
 form.reset();
 document.getElementById("priority").value="mittel";
 document.getElementById("status").value="offen";
 document.getElementById("dlg").showModal();
}
document.getElementById("cancel").onclick=()=>document.getElementById("dlg").close();
document.getElementById("form").onsubmit=e=>{
 e.preventDefault();
 const titleEl=document.getElementById("title");
 const priorityEl=document.getElementById("priority");
 const dateEl=document.getElementById("date");
 const placeEl=document.getElementById("place");
 const noteEl=document.getElementById("note");
 const statusEl=document.getElementById("status");
 items.push({
   id:Date.now().toString(),
   title:titleEl.value.trim(),
   priority:priorityEl.value,
   date:dateEl.value,
   place:placeEl.value.trim(),
   note:noteEl.value.trim(),
   status:statusEl.value
 });
 save();
 document.getElementById("dlg").close();
 render();
};
render();
</script>
</body>
</html>
