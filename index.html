<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haushaltskosten</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#1d1d1f;
}
header{
  background:white;
  padding:20px 16px 14px;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #ddd;
}
h1{margin:0;font-size:26px}
main{max-width:700px;margin:auto;padding:16px}

.form,.summary,.filters,.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #ddd;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:10px 0 5px;
}

input,select,button{
  width:100%;
  font:inherit;
  border-radius:11px;
  padding:12px;
}

input,select{
  border:1px solid #ccc;
  background:white;
}

button{
  border:0;
  background:#1d1d1f;
  color:white;
  font-weight:600;
  margin-top:12px;
}

.secondary{
  background:white;
  color:#1d1d1f;
  border:1px solid #ccc;
}

.hidden{display:none}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.summaryBox{
  background:#f5f5f7;
  border-radius:12px;
  padding:12px 8px;
  text-align:center;
}

.summaryBox span{
  display:block;
  font-size:12px;
  color:#666;
}

.summaryBox strong{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.card .name{
  font-size:17px;
  font-weight:700;
}

.info{
  color:#666;
  font-size:14px;
  margin-top:5px;
}

.amount{
  font-size:19px;
  font-weight:700;
  margin-top:8px;
}

.income{color:#16803c}
.expense{color:#c62828}

.cardActions{
  display:flex;
  gap:8px;
}

.cardActions button{
  flex:1;
}

.delete{
  background:white;
  color:#c62828;
  border:1px solid #ddd;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.filterTitle{
  font-weight:700;
  margin-bottom:8px;
}

@media(max-width:430px){
  .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>Haushaltskosten</h1>
</header>

<main>

<div class="form">

<label>Art</label>
<select id="type">
<option value="expense">Ausgabe</option>
<option value="income">Einnahme</option>
</select>

<label>Kosten / Bezeichnung</label>
<input id="name" type="text" placeholder="z. B. Strom">

<label>Betrag (€)</label>
<input id="amount" type="number" inputmode="decimal"
step="0.01" placeholder="0,00">

<label>Datum</label>
<input id="date" type="date">

<label>Kategorie</label>
<select id="category">
<option>Wohnen</option>
<option>Strom</option>
<option>Wasser</option>
<option>Heizung</option>
<option>Lebensmittel</option>
<option>Auto</option>
<option>Versicherung</option>
<option>Internet / Handy</option>
<option>Kinder</option>
<option>Gehalt</option>
<option>Kindergeld</option>
<option>Sonstiges</option>
</select>

<button id="saveButton" onclick="saveEntry()">
+ Eintrag hinzufügen
</button>

<button id="cancelEdit" class="secondary hidden"
onclick="cancelEdit()">
Bearbeiten abbrechen
</button>

</div>

<div class="summary">

<div class="summaryBox">
<span>Einnahmen</span>
<strong id="incomeTotal">0,00 €</strong>
</div>

<div class="summaryBox">
<span>Ausgaben</span>
<strong id="expenseTotal">0,00 €</strong>
</div>

<div class="summaryBox">
<span>Saldo</span>
<strong id="balanceTotal">0,00 €</strong>
</div>

</div>

<div class="filters">

<div class="filterTitle">Suchen & filtern</div>

<label>Suche</label>
<input id="search" type="search"
placeholder="z. B. Strom, Auto..."
oninput="render()">

<label>Kategorie</label>
<select id="filterCategory" onchange="render()">
<option value="">Alle Kategorien</option>
<option>Wohnen</option>
<option>Strom</option>
<option>Wasser</option>
<option>Heizung</option>
<option>Lebensmittel</option>
<option>Auto</option>
<option>Versicherung</option>
<option>Internet / Handy</option>
<option>Kinder</option>
<option>Gehalt</option>
<option>Kindergeld</option>
<option>Sonstiges</option>
</select>

<label>Monat</label>
<select id="filterMonth" onchange="render()">
<option value="">Alle Monate</option>
</select>

<label>Art</label>
<select id="filterType" onchange="render()">
<option value="">Alles</option>
<option value="expense">Ausgaben</option>
<option value="income">Einnahmen</option>
</select>

</div>

<div id="list"></div>

</main>

<script>

let entries=JSON.parse(
  localStorage.getItem("haushaltskosten")||"[]"
);

let editId=null;

function saveData(){
  localStorage.setItem(
    "haushaltskosten",
    JSON.stringify(entries)
  );
}

function euro(value){
  return Number(value).toLocaleString("de-DE",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+" €";
}

function formatDate(date){
  if(!date)return "";
  const p=date.split("-");
  return p[2]+"."+p[1]+"."+p[0];
}

function monthName(value){
  if(!value)return "";
  const [year,month]=value.split("-");
  const names=[
    "Januar","Februar","März","April","Mai","Juni",
    "Juli","August","September","Oktober","November","Dezember"
  ];
  return names[Number(month)-1]+" "+year;
}

function saveEntry(){

  const name=document.getElementById("name")
    .value.trim();

  const amount=parseFloat(
    document.getElementById("amount")
    .value.replace(",",".")
  );

  const date=document.getElementById("date").value;

  const category=document.getElementById("category").value;

  const type=document.getElementById("type").value;

  if(!name){
    alert("Bitte eine Bezeichnung eingeben.");
    return;
  }

  if(isNaN(amount)||amount<=0){
    alert("Bitte einen gültigen Betrag eingeben.");
    return;
  }

  if(editId){

    const item=entries.find(x=>x.id===editId);

    if(item){
      item.name=name;
      item.amount=amount;
      item.date=date;
      item.category=category;
      item.type=type;
    }

    editId=null;

  }else{

    entries.push({
      id:Date.now(),
      name:name,
      amount:amount,
      date:date,
      category:category,
      type:type
    });

  }

  saveData();
  clearForm();
  render();
}

function editEntry(id){

  const item=entries.find(x=>x.id===id);

  if(!item)return;

  editId=id;

  document.getElementById("name").value=item.name;
  document.getElementById("amount").value=item.amount;
  document.getElementById("date").value=item.date||"";
  document.getElementById("category").value=item.category||"Sonstiges";
  document.getElementById("type").value=item.type||"expense";

  document.getElementById("saveButton").textContent=
    "Änderung speichern";

  document.getElementById("cancelEdit")
    .classList.remove("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){

  editId=null;
  clearForm();
  render();

}

function clearForm(){

  document.getElementById("name").value="";
  document.getElementById("amount").value="";
  document.getElementById("date").value="";
  document.getElementById("type").value="expense";
  document.getElementById("category").value="Wohnen";

  document.getElementById("saveButton").textContent=
    "+ Eintrag hinzufügen";

  document.getElementById("cancelEdit")
    .classList.add("hidden");
}

function deleteEntry(id){

  if(!confirm("Diesen Eintrag wirklich löschen?"))
    return;

  entries=entries.filter(x=>x.id!==id);

  saveData();
  render();
}

function updateMonths(){

  const select=document.getElementById("filterMonth");
  const current=select.value;

  const months=[...new Set(
    entries
      .filter(x=>x.date)
      .map(x=>x.date.substring(0,7))
  )].sort().reverse();

  select.innerHTML=
    '<option value="">Alle Monate</option>';

  months.forEach(m=>{
    const option=document.createElement("option");
    option.value=m;
    option.textContent=monthName(m);
    select.appendChild(option);
  });

  select.value=months.includes(current)?current:"";
}

function render(){

  updateMonths();

  const search=document.getElementById("search")
    .value.toLowerCase().trim();

  const category=document.getElementById("filterCategory")
    .value;

  const month=document.getElementById("filterMonth")
    .value;

  const type=document.getElementById("filterType")
    .value;

  let filtered=entries.filter(x=>{

    const matchesSearch=
      !search ||
      x.name.toLowerCase().includes(search) ||
      (x.category||"").toLowerCase().includes(search);

    const matchesCategory=
      !category || x.category===category;

    const matchesMonth=
      !month || (x.date||"").startsWith(month);

    const matchesType=
      !type || (x.type||"expense")===type;

    return matchesSearch &&
           matchesCategory &&
           matchesMonth &&
           matchesType;
  });

  filtered.sort((a,b)=>{
    return (b.date||"").localeCompare(a.date||"") ||
           b.id-a.id;
  });

  let income=0;
  let expense=0;

  filtered.forEach(x=>{
    if((x.type||"expense")==="income")
      income+=Number(x.amount);
    else
      expense+=Number(x.amount);
  });

  document.getElementById("incomeTotal")
    .textContent=euro(income);

  document.getElementById("expenseTotal")
    .textContent=euro(expense);

  document.getElementById("balanceTotal")
    .textContent=euro(income-expense);

  const list=document.getElementById("list");

  if(!filtered.length){

    list.innerHTML=
      '<div class="card empty">'+
      'Keine Einträge gefunden.'+
      '</div>';

    return;
  }

  list.innerHTML=filtered.map(x=>{

    const isIncome=
      (x.type||"expense")==="income";

    return `
      <div class="card">

        <div class="name">
          ${escapeHtml(x.name)}
        </div>

        <div class="info">
          ${escapeHtml(x.category||"Sonstiges")}
          ${x.date ? " · "+formatDate(x.date) : ""}
          · ${isIncome ? "Einnahme" : "Ausgabe"}
        </div>

        <div class="amount ${isIncome?"income":"expense"}">
          ${isIncome?"+":"−"} ${euro(x.amount)}
        </div>

        <div class="cardActions">

          <button
            class="secondary"
            onclick="editEntry(${x.id})">
            ✏️ Bearbeiten
          </button>

          <button
            class="delete"
            onclick="deleteEntry(${x.id})">
            🗑️ Löschen
          </button>

        </div>

      </div>
    `;

  }).join("");
}

function escapeHtml(text){

  return String(text).replace(
    /[&<>"']/g,
    function(m){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];
    }
  );
}

render();

</script>

</body>
</html>
